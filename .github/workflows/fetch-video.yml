name: Fetch and compress thank-you video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/kovacs-construction-funnel-f0rbv6

      - name: Install gdown
        run: pip install --quiet gdown

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download source video from Drive
        run: |
          python - <<'PY'
          import gdown
          gdown.download(id="1daJekqYUzoy_lYom_YYEx0yLd8Z3e5D8", output="source.mp4", quiet=False)
          PY
          ls -lh source.mp4

      - name: Compress for web (720p, faststart) + poster
        run: |
          mkdir -p funnel/videos
          ffmpeg -y -i source.mp4 \
            -vf "scale=w=1280:h=1280:force_original_aspect_ratio=decrease:force_divisible_by=2" \
            -c:v libx264 -crf 27 -preset veryfast -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart \
            funnel/videos/thank-you.mp4
          ffmpeg -y -ss 00:00:01 -i funnel/videos/thank-you.mp4 -vframes 1 -q:v 3 \
            funnel/videos/thank-you-poster.jpg || true
          echo "=== output sizes ==="
          ls -lh funnel/videos/
          echo "bytes:"; stat -c '%s %n' funnel/videos/thank-you.mp4

      - name: Guard against >95MB (GitHub 100MB limit)
        run: |
          SIZE=$(stat -c '%s' funnel/videos/thank-you.mp4)
          echo "video is $SIZE bytes"
          if [ "$SIZE" -gt 99614720 ]; then
            echo "Too large (>95MB) — re-encoding at lower quality"
            ffmpeg -y -i source.mp4 \
              -vf "scale=w=960:h=960:force_original_aspect_ratio=decrease:force_divisible_by=2" \
              -c:v libx264 -crf 30 -preset veryfast -pix_fmt yuv420p \
              -c:a aac -b:a 96k -movflags +faststart \
              funnel/videos/thank-you.mp4
            ls -lh funnel/videos/thank-you.mp4
          fi

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funnel/videos
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add compressed self-hosted thank-you video (from client Drive)"
            git push origin HEAD:claude/kovacs-construction-funnel-f0rbv6
          fi
